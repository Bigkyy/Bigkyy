name: LiquidLeafReader
options:
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bigkyy.liquidleaf
    SWIFT_VERSION: 5.9
targets:
  LiquidLeaf:
    type: application
    platform: iOS
    sources:
      - path: LiquidLeafApp/Sources
    resources:
      - path: LiquidLeafApp/Resources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: LiquidLeaf
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SUPPORTS_MACCATALYST: YES
    scheme:
      testTargets: []
